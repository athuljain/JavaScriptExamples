 <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Array List Example</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 40px;
    }
    input, button {
      padding: 8px 12px;
      font-size: 16px;
    }
    ul {
      margin-top: 20px;
    }
    li {
      margin-bottom: 5px;
    }
  </style>
</head>
<body>

  <h2>My Item List</h2>

  <!-- Input Field and Button with inline onclick -->

  <input type="text" id="itemInput" placeholder="Type something...">
  <button onclick="addItem()">Add</button>

  <!-- Container for the displayed list -->
  <ul id="itemList"></ul>

  <!-- Internal JavaScript -->
  <script>
    // 1. Initialize an empty array to store items
    const itemsArray = [];

    // 2. Get references to HTML elements
    const itemInput = document.getElementById('itemInput');
    const itemList = document.getElementById('itemList');

    // 3. Function triggered when the "Add" button is clicked
    function addItem() {
      const text = itemInput.value.trim();

      // Only add non-empty values
      if (text !== '') {
        // Add to array
        itemsArray.push(text);

        // Clear input box
        itemInput.value = '';

        // Refresh the list display
        displayList();
      }
    }

    // 4. Function to render the array as HTML list items
    function displayList() {
      // Clear previous list content to prevent duplicates
      itemList.innerHTML = '';

      // Loop through the array and append each item as an <li> element
      for (let i = 0; i < itemsArray.length; i++) {
        const li = document.createElement('li');
        li.textContent = itemsArray[i];
        itemList.appendChild(li);
      }
    }
  </script>

</body>
 </html>
